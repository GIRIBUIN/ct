name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-distribution.ps1
      - if: runner.os == 'Linux'
        run: bash scripts/test-distribution.sh
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CGO_ENABLED: '0'
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate tag and build every asset
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || { echo 'Expected a version tag such as v0.1.0'; exit 1; }
          mkdir -p dist
          for target in windows/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            asset="ct-$os-$arch"
            if [[ "$os" == windows ]]; then asset+='.exe'; fi
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X github.com/GIRIBUIN/ct/internal/version.Version=$TAG" -o "dist/$asset" ./cmd/ct
          done
          [[ "$(dist/ct-linux-amd64 --version)" == "ct $TAG" ]]
          (cd dist && sha256sum ct-windows-amd64.exe ct-linux-amd64 ct-linux-arm64 > checksums.txt)
      - name: Publish assets for the existing tag
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "${TAG%%+*}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes "${flags[@]}" \
            dist/ct-windows-amd64.exe dist/ct-linux-amd64 dist/ct-linux-arm64 dist/checksums.txt
