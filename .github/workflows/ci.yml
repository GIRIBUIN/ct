name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/ct
      - name: Windows distribution script tests (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-distribution.ps1
      - name: Linux distribution script tests
        if: runner.os == 'Linux'
        run: bash scripts/test-distribution.sh
